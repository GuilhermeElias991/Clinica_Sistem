# Template: a imagem do nginx troca ${API_UPSTREAM} e ${NGINX_RESOLVER} pelas variáveis de ambiente
# (veja Dockerfile e docker-compose.yml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Back-end Spring Boot. O endereço fica numa variável para o nginx subir
    # mesmo se a API ainda não existir (ele só resolve o nome na hora da requisição).
    location /api/ {
        resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota (/agenda, /pacientes...) cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
